<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>整理券｜未来をますます知りますマス！</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<script>
/* =========================================================
   設定（ここだけ書き換えればOK）
   ========================================================= */
const CONFIG = {
  // スタッフ画面に入るための暗証番号（必ず変更してください）
  STAFF_PIN: "2525",

  // 番号をみんなのスマホに届けるための「合言葉」（ntfy.sh を使用・登録不要）
  // 他の人とかぶらないよう、英数字でなるべく長く・ランダムに変えてください。
  // 空 "" にすると、この端末の中だけで動く練習モードになります。
  TOPIC: "masumasu-2c-k7q4v9x2m8r3",

  // 端末内に保存するときの名前（ふつうは変えなくてOK）
  ROOM: "masumasu"
};
</script>
<style>
:root {
  --ink: #1B2466;
  --ink-soft: #4A5391;
  --paper: #F4F7FF;
  --grid: #DCE3FA;
  --masu: #FFFFFF;
  --sun: #FFC93C;
  --pink: #FF5C8A;
  --ok: #1FA67A;
  --line: #B9C3EC;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8ECFF;
    --ink-soft: #A9B1E0;
    --paper: #12163A;
    --grid: #1D2352;
    --masu: #1A2050;
    --line: #333C80;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; }
body {
  font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  min-height: 100vh;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.wrap { max-width: 560px; margin: 0 auto; padding: 16px 18px 48px; }

/* ヘッダー */
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.place { font-size: 0.85rem; color: var(--ink-soft); margin: 4px 0 0; }
.staff-btn {
  flex-shrink: 0;
  border: 2px solid var(--ink); background: var(--masu);
  border-radius: 999px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700;
  cursor: pointer;
}
.staff-btn:hover { background: var(--sun); color: #1B2466; }

h1 {
  font-family: "Dela Gothic One", sans-serif; font-weight: 400;
  font-size: clamp(1.6rem, 7vw, 2.3rem); line-height: 1.25;
  margin: 18px 0 6px; letter-spacing: 0.02em;
}
h1 .masu-word {
  display: inline-block; background: var(--sun); color: #1B2466;
  border: 2px solid #1B2466; padding: 0 6px; transform: rotate(-3deg);
}

/* ステータス */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 700; font-size: 0.9rem; margin: 8px 0 0;
}
.status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
.status[data-s="pause"]::before { background: var(--sun); }
.status[data-s="closed"]::before { background: var(--pink); }

.notice {
  margin: 14px 0 0; padding: 10px 14px; background: var(--sun); color: #1B2466;
  border: 2px solid #1B2466; border-radius: 6px; font-weight: 700;
}
.notice:empty { display: none; }

/* 呼び出し番号：マス目 */
.now { margin: 28px 0 0; text-align: center; }
.now-label { font-weight: 700; font-size: 1rem; margin: 0 0 10px; }
.masu-row { display: flex; justify-content: center; gap: 8px; }
.masu {
  width: clamp(72px, 22vw, 104px); aspect-ratio: 1;
  display: grid; place-items: center;
  background: var(--masu); border: 3px solid var(--ink);
  font-family: "Dela Gothic One", sans-serif;
  font-size: clamp(3rem, 15vw, 4.6rem); line-height: 1;
  box-shadow: 5px 5px 0 var(--ink);
}
.masu.flip { animation: flip .45s ease; }
@keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
@media (prefers-reduced-motion: reduce) { .masu.flip { animation: none; } }

.facts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 30px 0 0;
}
.fact { background: var(--masu); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.fact p { margin: 0; }
.fact .k { font-size: 0.8rem; color: var(--ink-soft); }
.fact .v { font-size: 1.5rem; font-weight: 700; }
.fact .v small { font-size: 0.85rem; margin-left: 2px; }

/* 自分の番号 */
.mine {
  margin: 28px 0 0; padding: 18px; background: var(--masu);
  border: 3px solid var(--ink); border-radius: 10px;
}
.mine h2 { font-size: 1.05rem; margin: 0 0 10px; }
.mine-input { display: flex; gap: 8px; }
.mine-input input {
  flex: 1; min-width: 0; font-size: 1.4rem; font-weight: 700; padding: 8px 12px;
  border: 2px solid var(--line); border-radius: 8px; background: var(--paper);
}
.btn {
  border: 2px solid var(--ink); background: var(--ink); color: var(--paper);
  border-radius: 8px; padding: 8px 16px; font-weight: 700; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); }
.btn.pink { background: var(--pink); border-color: var(--pink); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.result { margin: 14px 0 0; font-size: 1.05rem; }
.result:empty { display: none; }
.result .big { font-size: 2.2rem; font-weight: 700; font-family: "Dela Gothic One", sans-serif; }
.result.go { color: var(--ok); font-weight: 700; font-size: 1.3rem; }

.foot { margin: 28px 0 0; font-size: 0.78rem; color: var(--ink-soft); text-align: center; }

/* スタッフ画面 */
#staff { display: none; }
body.is-staff #guest { display: none; }
body.is-staff #staff { display: block; }
.panel { background: var(--masu); border: 2px solid var(--line); border-radius: 10px; padding: 16px; margin: 16px 0 0; }
.panel h2 { font-size: 1rem; margin: 0 0 10px; }
.counter { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.counter .num { font-family: "Dela Gothic One", sans-serif; font-size: 3rem; line-height: 1; }
.counter .ops { display: flex; gap: 8px; }
.big-btn { font-size: 1.15rem; padding: 14px 18px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0 0; }
.row label { flex: 1 1 140px; font-size: 0.9rem; }
.row input[type=number] {
  width: 90px; font-size: 1.1rem; padding: 6px 8px; border: 2px solid var(--line);
  border-radius: 6px; background: var(--paper);
}
textarea {
  width: 100%; min-height: 64px; padding: 8px; border: 2px solid var(--line);
  border-radius: 6px; background: var(--paper); resize: vertical;
}
.seg { display: flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 6px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.issued-flash { font-size: 0.95rem; margin: 10px 0 0; }
.issued-flash b { font-size: 1.6rem; font-family: "Dela Gothic One", sans-serif; }
.mode {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem;
  border: 2px dashed var(--pink);
}
.mode.online { border-color: var(--ok); }

/* PIN */
.pin-box { max-width: 320px; margin: 40px auto 0; text-align: center; }
.pin-box input {
  width: 100%; font-size: 1.6rem; text-align: center; letter-spacing: .3em;
  padding: 10px; border: 3px solid var(--ink); border-radius: 8px; background: var(--masu);
}
.pin-err { color: var(--pink); font-weight: 700; min-height: 1.7em; margin: 8px 0 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <p class="place">3号館 3階 2-C</p>
    <button class="staff-btn" id="toggleBtn" type="button">スタッフ用</button>
  </header>

  <!-- ================= 来場者画面 ================= -->
  <main id="guest">
    <h1>未来をますます<br>知ります<span class="masu-word">マス！</span></h1>
    <p class="status" id="gStatus" data-s="open">受付中</p>
    <p class="notice" id="gNotice" role="status"></p>

    <section class="now" aria-live="polite">
      <p class="now-label">いま呼び出し中の番号</p>
      <div class="masu-row" id="gNow" aria-label="呼び出し中の番号"></div>
    </section>

    <div class="facts">
      <div class="fact"><p class="k">待っている組数</p><p class="v"><span id="gWaitGroups">0</span><small>組</small></p></div>
      <div class="fact"><p class="k">いま並ぶと待ち時間</p><p class="v">約<span id="gWaitMin">0</span><small>分</small></p></div>
      <div class="fact"><p class="k">体験の所要時間</p><p class="v">約<span id="gDuration">10</span><small>分</small></p></div>
      <div class="fact"><p class="k">1組あたりの目安</p><p class="v"><span id="gPer">5</span><small>分</small></p></div>
    </div>

    <section class="mine">
      <h2>あなたの整理番号</h2>
      <div class="mine-input">
        <label class="sr" for="myNum">整理番号</label>
        <input id="myNum" type="number" inputmode="numeric" min="1" placeholder="例：12">
        <button class="btn" id="myBtn" type="button">確認する</button>
      </div>
      <div class="result" id="myResult" aria-live="polite"></div>
    </section>

    <p class="foot">このページは自動で更新されます。最終更新 <span id="gUpdated">--:--</span></p>
  </main>

  <!-- ================= スタッフ画面 ================= -->
  <main id="staff">
    <div id="pinGate" class="pin-box">
      <h2>スタッフ用</h2>
      <p>暗証番号を入力してください</p>
      <label class="sr" for="pin">暗証番号</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <p class="pin-err" id="pinErr"></p>
      <button class="btn" id="pinBtn" type="button">開く</button>
    </div>

    <div id="staffBody" hidden>
      <h1 style="font-size:1.5rem">スタッフ用</h1>
      <div class="mode" id="modeNote"></div>

      <div class="panel">
        <h2>呼び出し中の番号</h2>
        <div class="counter">
          <span class="num" id="sNow">0</span>
          <div class="ops">
            <button class="btn ghost" id="nowMinus" type="button" aria-label="1つ戻す">−1</button>
            <button class="btn pink big-btn" id="nowPlus" type="button">次の番号を呼ぶ</button>
          </div>
        </div>
        <p style="margin:8px 0 0;font-size:.85rem">待ち：<b id="sWait">0</b>組（約<b id="sWaitMin">0</b>分）</p>
      </div>

      <div class="panel">
        <h2>整理券の発行</h2>
        <div class="counter">
          <span>発行済み <b class="num" id="sIssued" style="font-size:2rem">0</b> 番まで</span>
          <button class="btn big-btn" id="issueBtn" type="button">1枚発行する</button>
        </div>
        <p class="issued-flash" id="issuedFlash"></p>
      </div>

      <div class="panel">
        <h2>受付状況</h2>
        <div class="seg" role="group" aria-label="受付状況">
          <button type="button" data-status="open">受付中</button>
          <button type="button" data-status="pause">一時停止</button>
          <button type="button" data-status="closed">受付終了</button>
        </div>
      </div>

      <div class="panel">
        <h2>時間の設定</h2>
        <div class="row">
          <label for="perIn">1組あたりの目安（分）<br><small>待ち時間の計算に使います</small></label>
          <input id="perIn" type="number" min="1" max="120">
        </div>
        <div class="row">
          <label for="durIn">体験の所要時間（分）</label>
          <input id="durIn" type="number" min="1" max="180">
        </div>
        <div class="row">
          <button class="btn" id="saveTime" type="button">時間を保存</button>
        </div>
      </div>

      <div class="panel">
        <h2>お知らせ（来場者画面に表示）</h2>
        <textarea id="noticeIn" maxlength="100" placeholder="例：15:30で整理券の配布を終了します"></textarea>
        <div class="row">
          <button class="btn" id="saveNotice" type="button">お知らせを表示</button>
          <button class="btn ghost" id="clearNotice" type="button">消す</button>
        </div>
      </div>

      <div class="panel">
        <h2>番号の直接入力</h2>
        <div class="row">
          <label for="setNow">呼び出し中の番号</label>
          <input id="setNow" type="number" min="0">
        </div>
        <div class="row">
          <label for="setIssued">発行済みの番号</label>
          <input id="setIssued" type="number" min="0">
        </div>
        <div class="row">
          <button class="btn" id="saveNums" type="button">番号を反映</button>
          <button class="btn ghost" id="resetAll" type="button" style="color:var(--pink);border-color:var(--pink)">すべて0に戻す</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const DEFAULT = { current: 0, issued: 0, perGroup: 5, duration: 10, status: "open", notice: "", updatedAt: 0 };
  let state = { ...DEFAULT };
  const $ = id => document.getElementById(id);
  const STATUS_TEXT = { open: "受付中", pause: "一時停止中", closed: "本日の受付は終了しました" };

  /* ---------- データ保存（ntfy.sh or 端末内） ---------- */
  const useOnline = !!CONFIG.TOPIC;
  const BASE = "https://ntfy.sh/" + encodeURIComponent(CONFIG.TOPIC);

  // 受け取ったデータが新しいときだけ反映
  function parseMsg(d) {
    if (!d || d.event !== "message") return null;
    try {
      const obj = JSON.parse(d.message);
      if (obj && obj.app === "masu") return obj;
    } catch (e) {}
    return null;
  }

  const store = {
    async init(onChange) {
      if (useOnline) {
        const apply = obj => {
          if (!obj) return;
          if ((obj.updatedAt || 0) < (state.updatedAt || 0)) return;
          onChange({ ...DEFAULT, ...obj });
        };
        const fetchLatest = async () => {
          const res = await fetch(BASE + "/json?poll=1&since=latest");
          const text = await res.text();
          const lines = text.trim().split("\n").filter(Boolean);
          for (const line of lines) { try { apply(parseMsg(JSON.parse(line))); } catch (e) {} }
          if (!lines.length) onChange({ ...state });
        };
        await fetchLatest();
        const es = new EventSource(BASE + "/sse");
        es.onmessage = e => { try { apply(parseMsg(JSON.parse(e.data))); } catch (err) {} };
        // スマホがスリープから戻ったときに取り直す
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") fetchLatest().catch(() => {});
        });
        this._online = true;
        this._onChange = onChange;
      } else {
        const read = () => {
          try { return { ...DEFAULT, ...JSON.parse(localStorage.getItem("queue_" + CONFIG.ROOM) || "{}") }; }
          catch (e) { return { ...DEFAULT }; }
        };
        onChange(read());
        window.addEventListener("storage", e => { if (e.key === "queue_" + CONFIG.ROOM) onChange(read()); });
        this._read = read;
        this._onChange = onChange;
      }
    },
    async update(patch) {
      patch.updatedAt = Date.now();
      if (this._online) {
        const next = { ...state, ...patch, app: "masu" };
        this._onChange(next);
        const res = await fetch(BASE, { method: "POST", body: JSON.stringify(next) });
        if (!res.ok) alert("送信できませんでした。電波を確認してもう一度押してください。");
        return;
      }
      const next = { ...this._read(), ...patch };
      try { localStorage.setItem("queue_" + CONFIG.ROOM, JSON.stringify(next)); } catch (e) {}
      this._onChange(next);
    },
    async issue() {
      const n = (this._online ? state.issued : this._read().issued) + 1;
      await this.update({ issued: n });
      return n;
    }
  };


  /* ---------- 表示 ---------- */
  let lastNow = null;
  function render() {
    const s = state;
    const waitGroups = Math.max(0, s.issued - s.current);
    const waitMin = waitGroups * s.perGroup;

    // マス目の番号
    if (lastNow !== s.current) {
      const digits = String(s.current).padStart(2, "0").split("");
      $("gNow").innerHTML = digits.map(d => `<span class="masu${lastNow !== null ? " flip" : ""}">${d}</span>`).join("");
      $("gNow").setAttribute("aria-label", "呼び出し中の番号 " + s.current + "番");
      lastNow = s.current;
    }
    $("gStatus").textContent = STATUS_TEXT[s.status] || "受付中";
    $("gStatus").dataset.s = s.status;
    $("gNotice").textContent = s.notice || "";
    $("gWaitGroups").textContent = waitGroups;
    $("gWaitMin").textContent = waitMin;
    $("gDuration").textContent = s.duration;
    $("gPer").textContent = s.perGroup;
    $("gUpdated").textContent = s.updatedAt ? new Date(s.updatedAt).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "--:--";
    renderMine();

    // スタッフ側
    $("sNow").textContent = s.current;
    $("sIssued").textContent = s.issued;
    $("sWait").textContent = waitGroups;
    $("sWaitMin").textContent = waitMin;
    $("nowMinus").disabled = s.current <= 0;
    document.querySelectorAll("[data-status]").forEach(b => b.setAttribute("aria-pressed", b.dataset.status === s.status));
    if (document.activeElement !== $("perIn")) $("perIn").value = s.perGroup;
    if (document.activeElement !== $("durIn")) $("durIn").value = s.duration;
  }

  function renderMine() {
    const my = parseInt($("myNum").value, 10);
    const box = $("myResult");
    box.className = "result";
    if (!my || my < 1) { box.innerHTML = ""; return; }
    const ahead = my - state.current;
    if (ahead === 0) {
      box.className = "result go";
      box.textContent = "あなたの番です！受付までお越しください";
    } else if (ahead < 0) {
      box.textContent = "この番号はすでに呼び出されました。受付のスタッフに声をかけてください。";
    } else {
      const min = ahead * state.perGroup;
      const at = new Date(Date.now() + min * 60000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
      box.innerHTML = `${my}番まで あと<span class="big">${ahead}</span>組<br>
        待ち時間 約<span class="big">${min}</span>分（${at}ごろ）`;
    }
  }

  /* ---------- 来場者の操作 ---------- */
  try { const saved = localStorage.getItem("myNum_" + CONFIG.ROOM); if (saved) $("myNum").value = saved; } catch (e) {}
  const saveMine = () => {
    try { localStorage.setItem("myNum_" + CONFIG.ROOM, $("myNum").value); } catch (e) {}
    renderMine();
  };
  $("myBtn").addEventListener("click", saveMine);
  $("myNum").addEventListener("keydown", e => { if (e.key === "Enter") saveMine(); });
  setInterval(renderMine, 30000); // 「◯時ごろ」を更新

  /* ---------- 画面切り替え ---------- */
  let unlocked = false;
  try { unlocked = sessionStorage.getItem("staffOk") === "1"; } catch (e) {}
  function route() {
    const staff = location.hash === "#staff";
    document.body.classList.toggle("is-staff", staff);
    $("toggleBtn").textContent = staff ? "来場者画面へ" : "スタッフ用";
    $("pinGate").hidden = unlocked;
    $("staffBody").hidden = !unlocked;
    if (staff && !unlocked) setTimeout(() => $("pin").focus(), 50);
  }
  $("toggleBtn").addEventListener("click", () => {
    location.hash = location.hash === "#staff" ? "" : "staff";
  });
  window.addEventListener("hashchange", route);

  const tryPin = () => {
    if ($("pin").value === String(CONFIG.STAFF_PIN)) {
      unlocked = true;
      try { sessionStorage.setItem("staffOk", "1"); } catch (e) {}
      $("pinErr").textContent = ""; $("pin").value = "";
      route();
    } else {
      $("pinErr").textContent = "暗証番号が違います";
    }
  };
  $("pinBtn").addEventListener("click", tryPin);
  $("pin").addEventListener("keydown", e => { if (e.key === "Enter") tryPin(); });

  /* ---------- スタッフの操作 ---------- */
  $("nowPlus").addEventListener("click", () => {
    const next = state.current + 1;
    const patch = { current: next };
    if (next > state.issued) patch.issued = next; // 発行数より先に進んだら合わせる
    store.update(patch);
  });
  $("nowMinus").addEventListener("click", () => store.update({ current: Math.max(0, state.current - 1) }));
  $("issueBtn").addEventListener("click", async () => {
    $("issueBtn").disabled = true;
    try {
      const n = await store.issue();
      $("issuedFlash").innerHTML = `今発行した番号：<b>${n}</b> 番`;
    } finally { $("issueBtn").disabled = false; }
  });
  document.querySelectorAll("[data-status]").forEach(b =>
    b.addEventListener("click", () => store.update({ status: b.dataset.status })));
  $("saveTime").addEventListener("click", () => {
    const per = Math.max(1, parseInt($("perIn").value, 10) || 1);
    const dur = Math.max(1, parseInt($("durIn").value, 10) || 1);
    store.update({ perGroup: per, duration: dur });
    $("saveTime").textContent = "保存しました";
    setTimeout(() => $("saveTime").textContent = "時間を保存", 1500);
  });
  $("saveNotice").addEventListener("click", () => store.update({ notice: $("noticeIn").value.trim() }));
  $("clearNotice").addEventListener("click", () => { $("noticeIn").value = ""; store.update({ notice: "" }); });
  $("saveNums").addEventListener("click", () => {
    const patch = {};
    const n = parseInt($("setNow").value, 10);
    const i = parseInt($("setIssued").value, 10);
    if (n >= 0) patch.current = n;
    if (i >= 0) patch.issued = i;
    if (Object.keys(patch).length) store.update(patch);
    $("setNow").value = ""; $("setIssued").value = "";
  });
  $("resetAll").addEventListener("click", () => {
    if (confirm("呼び出し番号と発行済み番号を0に戻します。よろしいですか？")) {
      store.update({ current: 0, issued: 0 });
      $("issuedFlash").textContent = "";
    }
  });

  $("modeNote").className = "mode" + (useOnline ? " online" : "");
  $("modeNote").textContent = useOnline
    ? "オンライン：ここでの操作は来場者のスマホにすぐ反映されます。操作するスタッフ端末は1台にしてください。"
    : "練習モード：この端末の中だけで動いています。来場者に反映するには CONFIG の TOPIC を設定してください。";

  /* ---------- 起動 ---------- */
  route();
  store.init(s => { state = s; render(); }).catch(err => {
    console.error(err);
    $("gNotice").textContent = "サーバーに接続できません。電波の良い場所で再読み込みしてください。";
  });
})();
</script>
</body>
</html>
